name: Build & Release MochiLedger

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shared-tests:
    name: Shared Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Shared Unit Tests
        run: ./gradlew :shared:desktopTest --no-daemon

  build-android:
    name: Android APK (with LSPosed Module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android APKs (32-bit, 64-bit, Universal)
        run: ./gradlew :androidApp:assembleDebug -PincludeAndroid=true --no-daemon
      - name: Collect Android APKs
        run: |
          mkdir -p android-apks
          ls -la androidApp/build/outputs/apk/debug/
          cp androidApp/build/outputs/apk/debug/*armeabi-v7a*.apk android-apks/MochiLedger-android-armeabi-v7a.apk
          cp androidApp/build/outputs/apk/debug/*arm64-v8a*.apk android-apks/MochiLedger-android-arm64-v8a.apk
          cp androidApp/build/outputs/apk/debug/*universal*.apk android-apks/MochiLedger-android-universal.apk
          ls -lh android-apks/
      - uses: actions/upload-artifact@v4
        with:
          name: mochiledger-android-apk
          path: android-apks/*.apk

  build-windows:
    name: Windows Desktop App (NSIS EXE + Portable Zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Windows Distributable
        run: .\gradlew.bat :desktopApp:createDistributable --no-daemon
      - name: Build Windows NSIS Setup EXE
        shell: pwsh
        run: |
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $makensis -and (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          if (-not $makensis) {
            choco install nsis -y --no-progress
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          $ver = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $Matches[1] } else { "1.0.9" }
          $srcDir = (Resolve-Path "desktopApp\build\compose\binaries\main\app\MochiLedger").Path
          $outFile = Join-Path (Get-Location).Path "MochiLedger-windows-x64-setup.exe"
          & $makensis "/INPUTCHARSET" "UTF8" "/DAPP_VERSION=$ver" "/DSOURCE_DIR=$srcDir" "/DOUTPUT_FILE=$outFile" "desktopApp\packaging\windows\installer.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item $outFile | Select-Object Name, Length
      - name: Package Windows Portable Zip
        shell: pwsh
        run: Compress-Archive -Path desktopApp\build\compose\binaries\main\app\MochiLedger\* -DestinationPath MochiLedger-windows-x64-portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: mochiledger-windows-x64
          path: |
            MochiLedger-windows-x64-setup.exe
            MochiLedger-windows-x64-portable.zip

  publish-release:
    name: Publish GitHub Release
    needs: [ shared-tests, build-android, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Rename Release Assets with Tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release-files
          cp release-artifacts/MochiLedger-android-universal.apk "release-files/MochiLedger-${TAG}-android-universal.apk"
          cp release-artifacts/MochiLedger-android-arm64-v8a.apk "release-files/MochiLedger-${TAG}-android-arm64-v8a.apk"
          cp release-artifacts/MochiLedger-android-armeabi-v7a.apk "release-files/MochiLedger-${TAG}-android-armeabi-v7a.apk"
          cp release-artifacts/MochiLedger-windows-x64-setup.exe "release-files/MochiLedger-${TAG}-windows-x64-setup.exe"
          cp release-artifacts/MochiLedger-windows-x64-portable.zip "release-files/MochiLedger-${TAG}-windows-x64-portable.zip"
          ls -lh release-files
      - name: Build Release Notes with Changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          {
            echo "## 墨记 MochiLedger ${TAG}"
            echo ""
            echo "### 更新日志 (Changelog)"
            awk -v tag="## ${TAG}" '
              $0 == tag { found=1; next }
              /^## / && found { exit }
              found { print }
            ' CHANGELOG.md
            echo ""
            echo "### 下载说明"
            echo "- **Windows 安装版（NSIS）**：\`MochiLedger-${TAG}-windows-x64-setup.exe\`"
            echo "- **Windows 便携免安装版**：\`MochiLedger-${TAG}-windows-x64-portable.zip\`"
            echo "- **Android 通用版（32/64位均可安装）**：\`MochiLedger-${TAG}-android-universal.apk\`"
            echo "- **Android 64位版（arm64-v8a）**：\`MochiLedger-${TAG}-android-arm64-v8a.apk\`"
            echo "- **Android 32位版（armeabi-v7a）**：\`MochiLedger-${TAG}-android-armeabi-v7a.apk\`"
            echo ""
            echo "> 独立同步服务端（支持 Cloudflare Workers + KV 免费部署与 Docker 自建）已拆分至独立仓库：[ackd7/MochiLedger-SyncServer](https://github.com/ackd7/MochiLedger-SyncServer)"
          } > release-notes.md
          cat release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE_FLAG=""
          if [[ "${TAG}" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${TAG}" release-files/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "墨记 MochiLedger ${TAG}" \
            --notes-file release-notes.md \
            ${PRERELEASE_FLAG}
