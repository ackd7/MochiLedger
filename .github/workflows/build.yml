name: Build & Test MochiLedger

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-server:
    name: Shared Tests & Sync Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Shared & Server Tests
        run: ./gradlew :shared:desktopTest :syncServer:test :syncServer:installDist --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mochiledger-sync-server
          path: syncServer/build/install/syncServer

  build-android:
    name: Android APK (with LSPosed Module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug -PincludeAndroid=true --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mochiledger-android-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  build-windows:
    name: Windows Desktop App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Windows Distributable
        run: .\gradlew.bat :desktopApp:createDistributable --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mochiledger-windows-x64
          path: desktopApp/build/compose/binaries/main/app/MochiLedger
